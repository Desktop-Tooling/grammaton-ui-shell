<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-labelledby="title desc">
  <title id="title">Grammaton UI Shell</title>
  <desc id="desc">Geometric mark and wordmark for a desktop UI shell on an actor-supervised runtime.</desc>
  <defs>
    <linearGradient id="grammaton-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a80"/>
      <stop offset="100%" stop-color="#98c1d9"/>
    </linearGradient>
  </defs>
  <!-- Mark: balanced angular frame (order) with inner aperture (supervision) -->
  <g transform="translate(12 12)">
    <path fill="url(#grammaton-accent)" d="M0 48 L24 0 L48 0 L72 24 L72 72 L48 96 L24 96 L0 72 Z"/>
    <path fill="#0d1b2a" d="M18 48 L36 18 L54 18 L60 30 L60 66 L54 78 L36 78 L18 48 Z"/>
    <circle cx="39" cy="48" r="6" fill="#e0fbfc"/>
    <path fill="none" stroke="#e0fbfc" stroke-width="2.5" stroke-linecap="square" d="M30 48 L48 48 M39 39 L39 57"/>
  </g>
  <!-- Wordmark -->
  <text x="104" y="52" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d1b2a" letter-spacing="-0.5">Grammaton</text>
  <text x="104" y="82" font-family="system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#3d5a80" letter-spacing="0.12em">UI SHELL</text>
</svg>
